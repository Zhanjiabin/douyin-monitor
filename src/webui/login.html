<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录 · 观潮</title><link rel="stylesheet" href="/login.css"></head>
<body>
<main class="login-card">
  <a class="brand" href="/login" aria-label="观潮"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span><span>观潮</span></a>
  <h1>登录</h1>
  <form id="loginForm">
    <label for="username">账号<input id="username" name="username" autocomplete="username" placeholder="输入账号" maxlength="100" required autofocus></label>
    <label for="password">密码<span class="password-field"><input id="password" name="password" type="password" autocomplete="current-password" placeholder="输入密码" maxlength="1024" required><button type="button" id="showPassword" aria-label="显示密码" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button></span></label>
    <p id="loginError" role="alert" hidden></p>
    <button class="login-submit" type="submit">登录</button>
  </form>
</main>
<script src="/login.js"></script>
</body></html>
