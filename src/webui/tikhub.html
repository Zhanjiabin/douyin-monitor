<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>观潮 · TikHub 接口</title><link rel="stylesheet" href="/screen.css"><link rel="stylesheet" href="/shell.css"><link rel="stylesheet" href="/tikhub.css"></head>
<body data-app="tikhub"><aside class="sidebar"></aside><div class="shell">
<header class="topbar"><div class="topbar-title"><span>数据源</span><span>/</span><b>TikHub 接口</b></div><div class="top-actions"><span id="connectionState" class="muted"></span><button class="btn" id="openSettings">连接设置</button><a class="btn" href="/workspace#playback">播放量补采 ↗</a></div></header>
<main class="api-main"><div class="api-toolbar"><div class="api-meta"><b id="catalogCount">正在读取接口</b><span id="catalogVersion" class="muted"></span></div><div class="api-quota"><span id="quota"></span><a href="https://api.tikhub.io/" target="_blank" rel="noreferrer">官方文档 ↗</a></div></div>
<div class="api-layout">
<section class="panel endpoint-panel" aria-label="接口目录"><div class="endpoint-filters"><select id="apiGroup" aria-label="接口分组"></select><input id="endpointSearch" placeholder="搜索接口 / 功能" aria-label="搜索接口"><div class="list-controls"><span id="groupCount" class="muted"></span><label><input id="onlyFavorites" type="checkbox">收藏</label></div></div><nav id="endpointList" class="endpoint-list" aria-label="接口列表"></nav></section>
<section class="panel request-panel"><div class="api-operation"><div class="operation-kicker"><span id="requestMethod" class="method">GET</span><code id="operationSlug"></code><button id="favorite" class="favorite" aria-label="收藏接口">☆</button></div><h1 id="operationTitle">接口参数</h1><a id="operationDocs" class="text-link" target="_blank" rel="noreferrer">文档 ↗</a></div>
<form id="requestForm"><div class="request-inputs"><select id="localSource" aria-label="从监控库填入"><option value="">从监控作品 / 账号填入…</option></select><div id="parameterFields"></div><div id="bodyField" hidden><div class="field-heading"><label for="bodyJson">JSON 请求体</label><button class="text-link" type="button" id="fillBodyExample">填入示例</button></div><textarea id="bodyJson" class="code-editor" rows="9" spellcheck="false" aria-label="JSON 请求体"></textarea><details class="schema-details"><summary>请求体结构</summary><pre id="bodySchema"></pre></details></div>
<div class="request-options"><label id="pageLimitLabel">最多页数<input id="pageLimit" type="number" min="1" max="100" value="1"></label><label id="importLabel" class="check-label"><input type="checkbox" id="importResults"><span id="importText">写入本机内容库</span></label></div>
<details id="batchDetails" class="batch-details"><summary>批量请求</summary><p>每项是一次独立请求；params 为查询参数，body 为 JSON 请求体。</p><button type="button" class="text-link" id="batchTemplate">从当前参数生成</button><textarea id="batchJson" class="code-editor" rows="6" aria-label="批量请求 JSON" spellcheck="false" placeholder='[{"params":{"aweme_ids":"视频ID"}}]'></textarea></details>
<details class="api-description"><summary>接口说明</summary><pre id="operationDescription"></pre></details></div>
<div class="request-footer"><div id="requestPreview" class="request-preview" role="status">填写参数后预览请求数</div><label class="check-label consent"><input type="checkbox" id="confirmCalls">确认请求数，并使用接口所需额度</label><div class="request-buttons"><button class="btn" id="previewRequest" type="button">预览请求数</button><button class="btn primary" id="runRequest" type="submit" disabled>执行请求</button></div><p id="requestError" class="inline-error" role="alert"></p></div></form></section>
<section class="panel result-panel"><div class="result-toolbar"><div class="result-tabs" role="tablist" aria-label="响应视图"><button role="tab" aria-selected="true" class="active" data-result-view="table">数据</button><button role="tab" aria-selected="false" data-result-view="json">JSON</button><button role="tab" aria-selected="false" data-result-view="history">任务记录</button></div><div class="result-actions"><button id="cancelRequest" class="text-link" hidden>取消</button><button id="nextPage" class="text-link" hidden>下一页</button><select id="exportFormat" aria-label="导出格式"><option value="json">JSON</option><option value="csv">CSV</option><option value="xlsx">Excel</option></select><a class="btn" id="exportResult" aria-disabled="true">导出</a></div></div>
<div id="resultSummary" class="result-summary"><span>尚未请求</span><span class="muted">预览不会调用 TikHub</span></div><div id="responseContent" class="response-content"></div><div id="responsePager" class="response-pager" hidden><button id="rowsPrev" class="btn">上一页</button><span id="rowsPage"></span><button id="rowsNext" class="btn">下一页</button></div><div id="receiptList" class="receipt-list"></div></section>
</div></main></div>
<dialog id="settingsDialog"><form id="settingsForm"><div class="panel-head"><h2>TikHub 连接</h2><button class="text-link" type="button" id="closeSettings">关闭</button></div><div class="settings-fields"><label>API Key<input type="password" id="apiKey" autocomplete="off" placeholder="仅保存在本机，保存后不回显"></label><div class="setting-pair"><label>单次请求上限<input id="maxCalls" type="number" min="1" max="100"></label><label>每日请求上限<input id="dailyCalls" type="number" min="1" max="10000"></label></div><p class="muted">与播放量补采共用连接和请求限额。API Key 与抖音登录相互独立。</p><div class="settings-actions"><a class="text-link" href="https://user.tikhub.io/" target="_blank" rel="noreferrer">获取 Key ↗</a><button type="button" id="clearKey" class="text-link">清除 Key</button><button type="submit" class="btn primary">保存</button></div><p id="settingsError" class="inline-error" role="alert"></p></div></form></dialog>
<div class="toast" id="toast" role="status"></div><script src="/shell.js"></script><script src="/tikhub.js"></script></body></html>
