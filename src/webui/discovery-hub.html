<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><script src="/theme.js"></script><meta name="viewport" content="width=device-width,initial-scale=1"><title>发现 · 暖暖影视</title><link rel="stylesheet" href="/screen.css"><link rel="stylesheet" href="/shell.css"><link rel="stylesheet" href="/product.css"><link rel="stylesheet" href="/discovery.css"><link rel="stylesheet" href="/discovery-hub.css"><link rel="stylesheet" href="/theme.css"></head>
<body data-app="discovery" class="discovery-hub"><aside class="sidebar"></aside><div class="shell">
<header class="topbar"><div class="topbar-title"><b>发现</b></div><div class="hub-header-actions"><span id="hubLastUpdated"></span><button class="btn" id="hubAutomation">自动更新</button><button class="btn primary" id="hubSync">同步榜单</button></div></header>
<main class="hub-main">
<nav class="hub-tabs" aria-label="发现导航"><a href="#library" data-hub-view="library">作品库</a><a href="#pulse" data-hub-view="pulse">热点榜</a><a href="#reports" data-hub-view="reports">选题报告</a><a class="hub-advanced" href="/discover/advanced">更多榜单</a></nav>
<form id="hubFilters" class="hub-filters">
<input name="keyword" aria-label="关键词" placeholder="搜索标题、作者、作品 ID" maxlength="120">
<select name="source" aria-label="榜单来源"><option value="">全部榜单</option></select>
<select name="category" aria-label="采集分类"><option value="">全部采集分类</option></select>
<select name="days" aria-label="发布时间"><option value="0">全部发布时间</option><option value="1">近一天发布</option><option value="7">近七天发布</option><option value="30">近三十天发布</option></select>
<select name="sort" aria-label="排序"><option value="seen">最近收录</option><option value="new">最新发布</option><option value="plays">榜单播放</option><option value="likes">点赞最高</option><option value="rank">榜内排名</option><option value="rising">排名上升</option><option value="heat">热度最高</option></select>
<button class="btn primary" type="submit">搜索</button><button class="btn" type="reset">重置</button>
</form>
<section id="hubLibraryView">
<div class="hub-toolbar"><div><button class="btn" id="hubMonitor" disabled>加入监控</button><a class="btn" id="hubExport" href="#">导出表格</a><button class="btn" id="hubDensity" aria-pressed="false">紧凑显示</button></div><span id="hubFeedback" role="status"></span></div>
<div id="hubQuote" hidden></div>
<div class="hub-table-panel"><div class="hub-table-scroll"><table id="hubTable"><thead></thead><tbody></tbody></table></div><div id="hubPager"></div></div>
</section>
<section id="hubReportsView" hidden>
<form class="hub-filters hub-report-filters" id="hubReportFilters"><select name="kind" aria-label="报告类型"><option value="daily">选题日报</option><option value="weekly">选题周报</option></select><input type="date" name="date" aria-label="报告截至日期" required><select id="hubReportHistory" aria-label="已保存报告"><option value="">已保存的报告</option></select><button class="btn" type="submit">查看</button><button class="btn" type="reset">重置</button><button class="btn primary" id="hubGenerate" type="button">生成本地报告</button><a class="btn" id="hubReportExport" hidden>下载报告</a></form>
<div id="hubReportBody"></div>
</section>
<p class="hub-error" id="hubError" role="alert"></p>
</main></div>
<dialog id="hubDetail" class="product-dialog hub-detail"><header class="product-dialog-head"><h2>收录明细</h2><button class="btn" data-hub-close>关闭</button></header><div class="product-dialog-body" id="hubDetailBody"></div></dialog>
<dialog id="hubSchedule" class="product-dialog hub-schedule"><header class="product-dialog-head"><h2></h2><button class="btn" data-hub-close>关闭</button></header><div class="product-dialog-body"></div></dialog>
<div id="toast" class="toast" role="status"></div><script src="/shell.js"></script><script src="/product.js"></script><script src="/audience.js"></script><script src="/discovery-hub.js"></script></body></html>
