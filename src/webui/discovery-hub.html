<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><script src="/theme.js"></script><meta name="viewport" content="width=device-width,initial-scale=1"><title>发现 · 暖暖影视</title><link rel="stylesheet" href="/screen.css"><link rel="stylesheet" href="/shell.css"><link rel="stylesheet" href="/product.css"><link rel="stylesheet" href="/discovery.css"><link rel="stylesheet" href="/discovery-hub.css"><link rel="stylesheet" href="/ip-radar.css"><link rel="stylesheet" href="/theme.css"></head>
<body data-app="discovery" class="discovery-hub"><aside class="sidebar"></aside><div class="shell">
<header class="topbar"><div class="topbar-title"><b>发现</b></div><div class="hub-header-actions"><span id="hubLastUpdated"></span><button class="btn" id="hubAutomation">监测计划</button><button class="btn" id="hubFind">定向搜索</button><button class="btn primary" data-radar-run>发现与追踪</button></div></header>
<main class="hub-main">
<nav class="hub-tabs" aria-label="发现导航"><a href="#library" data-hub-view="library">AI 作品</a><a href="#references" data-hub-view="references">IP 雷达</a><a href="#reports" data-hub-view="reports">内容报告</a><a class="hub-advanced" href="/discover/advanced">综合榜单</a></nav>
<form id="hubFilters" class="hub-filters">
<input name="keyword" aria-label="关键词" placeholder="搜索标题、作者、作品 ID" maxlength="120">
<select name="focus" aria-label="创作方向"><option value="ai">全部 AI 方向</option><option value="comic">AI 漫剧</option><option value="drama">AI 短剧</option><option value="pet">AI 萌宠 IP</option><option value="cinema">AI 大片</option><option value="all">全部已存内容</option></select>
<select name="source" aria-label="榜单来源"><option value="">全部榜单</option></select>
<select name="category" aria-label="采集分类"><option value="">全部采集分类</option></select>
<select name="days" aria-label="发布时间"><option value="0">全部发布时间</option><option value="1">近一天发布</option><option value="7">近七天发布</option><option value="14">近十四天发布</option><option value="30">近三十天发布</option></select>
<select name="sort" aria-label="排序"><option value="new">最新发布</option><option value="seen">最近收录</option><option value="video_plays">作品播放</option><option value="likes">点赞</option><option value="comments">评论</option><option value="saves">收藏</option><option value="shares">分享</option><option value="updated">数据更新</option><option value="fans">粉丝</option><option value="author">作者</option><option value="title">标题</option><option value="plays">榜单窗口播放</option><option value="rank">榜内排名</option><option value="rising">排名上升</option><option value="heat">热度</option></select>
<button class="btn primary" type="submit">搜索</button><button class="btn" type="reset">重置</button>
</form>
<section id="hubLibraryView">
<div class="hub-toolbar"><div><button class="btn primary" id="hubEnrich" disabled>更新选中数据</button><button class="btn" id="hubMonitor" disabled>监控作品</button><a class="btn" id="hubExport" href="#">导出表格</a><button class="btn" id="hubDensity" aria-pressed="false">紧凑显示</button></div><span id="hubFeedback" role="status"></span></div>
<div id="hubQuote" hidden></div>
<div class="hub-table-panel"><div class="hub-table-scroll"><table id="hubTable"><thead></thead><tbody></tbody></table></div><div id="hubPager"></div></div>
</section>
<section id="hubReferencesView" hidden><form id="radarFilters" class="hub-filters"><input name="keyword" placeholder="搜索剧名、角色 IP、作者" aria-label="搜索 IP"><select name="focus" aria-label="IP 方向"><option value="ai">全部 AI 方向</option><option value="comic">AI 漫剧</option><option value="drama">AI 短剧</option><option value="pet">AI 萌宠 IP</option><option value="cinema">AI 大片</option></select><select name="state" aria-label="IP 状态"><option value="recent">近期候选</option><option value="rising">已观测增长</option><option value="verified">作者已核实</option><option value="classic">旧作参考</option><option value="all">全部</option></select><button class="btn primary" type="submit">搜索</button><button class="btn" type="reset">重置</button></form><div class="radar-grid-scroll"><div id="radarCards"></div></div><div id="radarPager"></div><details id="radarBookmarks"><summary>原作书签</summary><div id="hubReferenceCards"></div></details></section>
<section id="hubReportsView" hidden>
<form class="hub-filters hub-report-filters" id="hubReportFilters"><select name="kind" aria-label="报告类型"><option value="daily">选题日报</option><option value="weekly">选题周报</option></select><input type="date" name="date" aria-label="报告截至日期" required><select id="hubReportHistory" aria-label="已保存报告"><option value="">已保存的报告</option></select><button class="btn" type="submit">查看</button><button class="btn" type="reset">重置</button><button class="btn primary" id="hubGenerate" type="button">生成本地报告</button><a class="btn" id="hubReportExport" hidden>下载报告</a></form>
<div id="hubReportBody"></div>
</section>
<p class="hub-error" id="hubError" role="alert"></p>
</main></div>
<dialog id="hubDetail" class="product-dialog hub-detail"><header class="product-dialog-head"><h2>收录明细</h2><button class="btn" data-hub-close>关闭</button></header><div class="product-dialog-body" id="hubDetailBody"></div></dialog>
<dialog id="hubSchedule" class="product-dialog hub-schedule"><header class="product-dialog-head"><h2></h2><button class="btn" data-hub-close>关闭</button></header><div class="product-dialog-body"></div></dialog>
<dialog id="hubCreative" class="product-dialog hub-creative"><header class="product-dialog-head"><h2>定向找作品</h2><button class="btn" data-hub-close>关闭</button></header><div class="product-dialog-body"><form id="hubCreativeForm"><div class="hub-creative-grid"><label>方向<select name="lane" aria-label="采集方向"></select></label><label>发布时间<select name="days"><option value="7">近七天</option><option value="30">近三十天</option><option value="0">不限时间</option></select></label></div><div id="hubCreativeSeeds" class="hub-seeds"></div><label>关键词<input name="keyword" aria-label="采集关键词" maxlength="80" placeholder="作品、IP 名称或内容方向" required></label><p class="hub-caption" id="hubCreativeStudy"></p><div class="hub-creative-actions"><button class="btn primary" type="submit">预览本次抓取</button><button class="btn" type="button" id="hubCreativeSchedule">设置定时搜索</button><span class="hub-caption">每次一个词，结果保存后可反复查看</span></div></form><div id="hubCreativeQuote" hidden></div><p role="alert" id="hubCreativeError" class="hub-error"></p></div></dialog>
<div id="toast" class="toast" role="status"></div><script src="/shell.js"></script><script src="/product.js"></script><script src="/audience.js"></script><script src="/ip-radar.js"></script><script src="/discovery-hub.js"></script></body></html>
