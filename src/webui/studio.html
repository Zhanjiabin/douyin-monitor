<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><script src="/theme.js"></script><meta name="viewport" content="width=device-width,initial-scale=1"><title>暖暖影视 · 采集工作台</title><link rel="stylesheet" href="/screen.css"><link rel="stylesheet" href="/studio.css"><link rel="stylesheet" href="/shell.css"><link rel="stylesheet" href="/product.css"><link rel="stylesheet" href="/theme.css"></head>
<body data-app="studio"><aside class="sidebar"><a class="brand" href="/screen"><div class="brandmark"><i></i><i></i><i></i></div><span>暖暖影视</span></a><nav class="nav"><a href="/screen#overview">作品监控</a><a href="/screen#accounts">监控账号</a><a href="/screen#topics">题材研究</a><a href="/screen#titles">标题分析</a><a class="selected" href="/studio">采集工作台</a><a href="/">定时与合集</a></nav><div class="sidebar-bottom"><a href="https://github.com/JoeanAmier/TikTokDownloader" target="_blank" rel="noreferrer">DouK-Downloader 5.8 ↗</a><small>GPL-3.0 · 本机运行</small></div></aside>
<div class="shell"><header class="topbar"><div class="topbar-title"><span>内容情报</span><span>/</span><b>采集工作台</b></div><div class="top-actions"><span id="engineState" class="muted">连接中</span><button class="btn" id="syncSession">同步抖音登录</button><button class="btn primary" id="backfill">播放量补采</button></div></header>
<main class="studio-main"><div class="studio-tabs"><button class="active" data-view="collect">采集任务 <span id="jobCount">0</span></button><button data-view="downloads">下载文件 <span id="fileCount">0</span></button><button data-view="settings">引擎设置</button><div class="spacer"></div><button class="btn" id="refreshStudio">刷新</button></div>
<section id="view-collect" class="studio-view active"><div class="studio-workspace"><div class="panel task-composer"><div class="platform-switch"><button class="active" data-platform="douyin">抖音</button><button data-platform="tiktok">TikTok</button></div><form id="taskForm"><label class="field">采集内容<select id="operation" aria-label="采集内容"></select></label><div id="taskFields"></div><details id="advancedFields"><summary>更多参数</summary><div id="optionalFields"></div></details><div class="task-options"><label><input type="checkbox" id="downloadMedia"> 同时下载媒体</label><label><input type="checkbox" id="importMonitor"> 加入作品监控</label></div><button class="btn preset-button" type="button" id="usePreset" hidden>读取预设账号 / 合集</button><div class="composer-buttons"><button class="btn primary" type="submit" id="submitTask">开始采集</button><button class="btn" type="button" id="pasteLinks">粘贴</button><label class="btn">导入 TXT<input type="file" id="importTxt" accept=".txt" hidden></label></div><div class="inline-error" id="formError" role="alert"></div></form><div class="composer-note" id="operationNote"></div><div class="clipboard-control"><label><input id="clipboardWatch" type="checkbox"> 监听剪贴板中的作品链接</label><span id="clipboardStatus"></span></div></div>
<div class="studio-results"><div class="panel queue-panel"><div class="panel-head"><h2>任务队列</h2><span id="queueSummary" class="muted"></span></div><div class="queue-list" id="jobList"></div></div><div class="panel result-panel"><div class="panel-head"><h2 id="resultTitle">采集结果</h2><div class="actions"><input id="resultSearch" class="small-search" placeholder="筛选结果" aria-label="筛选结果"><button class="btn" id="importResult" disabled>加入监控</button><button class="btn" id="resetDownloads" disabled title="清除这些作品的下载去重记录，允许重新下载">重置下载记录</button><select id="exportFormat" aria-label="导出格式"><option value="xlsx">Excel</option><option value="csv">CSV</option><option value="json">JSON</option></select><button class="btn" id="exportResult" disabled>导出</button></div></div><div id="resultMessage" class="result-message"></div><div class="table-scroll result-table" id="resultTable"><div class="compact-empty">选择左侧采集内容，或打开已有任务。</div></div><div id="studioPagination"></div></div></div></div></section>
<section id="view-downloads" class="studio-view"><div class="panel"><div class="panel-head"><h2>本地文件</h2><span class="muted">视频 · 图集 · 封面 · 音乐 · 直播</span></div><div class="table-scroll"><table><thead><tr><th>文件</th><th>大小</th><th>更新时间</th><th>操作</th></tr></thead><tbody id="filesBody"></tbody></table></div></div></section>
<section id="view-settings" class="studio-view"><form id="settingsForm" class="settings-grid"><div class="panel settings-panel"><h2>登录与网络</h2><label class="field">抖音 Cookie <span id="dyCookieStatus"></span><textarea id="dyCookie" rows="3" autocomplete="off" spellcheck="false" placeholder="已登录采集浏览器可直接点击顶部「同步抖音登录」"></textarea></label><label class="field">TikTok Cookie <span id="tkCookieStatus"></span><textarea id="tkCookie" rows="3" autocomplete="off" spellcheck="false" placeholder="仅保存在本机，不回传显示"></textarea></label><label class="field">抖音代理<input data-setting="proxy" placeholder="留空使用直连"></label><label class="field">TikTok 代理<input data-setting="proxy_tiktok" placeholder="http://127.0.0.1:7890"></label><label class="field">FFmpeg 路径<input data-setting="ffmpeg" placeholder="已加入 PATH 时可留空"></label></div><div class="panel settings-panel"><h2>下载与采集</h2><div class="settings-pairs"><label class="field">文件命名<input data-setting="name_format"></label><label class="field">文件夹名<input data-setting="folder_name"></label><label class="field">最多请求页数<input data-setting="max_pages" type="number" min="0"></label><label class="field">重试次数<input data-setting="max_retry" type="number" min="0" max="5"></label><label class="field">请求超时（秒）<input data-setting="timeout" type="number" min="1"></label><label class="field">最大文件大小（字节，0 不限）<input data-setting="max_size" type="number" min="0"></label></div><div class="settings-checks"><label><input data-setting="music" type="checkbox"> 下载配乐</label><label><input data-setting="static_cover" type="checkbox"> 静态封面</label><label><input data-setting="dynamic_cover" type="checkbox"> 动态封面</label><label><input data-setting="folder_mode" type="checkbox"> 每个作品独立文件夹</label><label><input data-setting="original_quality" type="checkbox"> 优先原画</label></div><details><summary>全部高级设置</summary><textarea id="settingsJson" rows="14" spellcheck="false" aria-label="全部高级设置"></textarea><button class="btn" type="button" id="applyAdvanced">保存高级设置</button></details><div class="settings-footer"><button class="btn primary" type="submit">保存设置</button><span id="settingsMessage"></span></div></div></form><div class="panel capability-panel"><div class="panel-head"><h2>功能覆盖</h2><span id="capabilityCount"></span></div><div id="capabilityList"></div><div id="upstreamUnavailable" class="muted"></div></div></section>
</main></div><dialog id="rawDialog"><div class="modal-head"><h2>完整数据</h2><button class="btn" id="closeRaw">关闭</button></div><pre id="rawData"></pre><div id="streamActions"></div></dialog><div id="toast" class="toast" role="status"></div><script src="/shell.js"></script><script src="/product.js"></script><script src="/studio.js"></script></body></html>
